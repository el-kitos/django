{% extends "polls/base.html" %}

{% block content %}

<h1>{{ question.question_text }}</h1>

<ul>
{% for choice in question.choice_set.all %}
    <li>{{ choice.choice_text }} -- {{ choice.votes }} votos</li>
{% endfor %}
</ul>

<a href="{% url 'polls:detail' question.id %}">Votar de nuevo</a>

{% endblock %}
